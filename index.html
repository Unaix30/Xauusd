<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Elite Terminal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131c2e',
                        goldAccent: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-cardBg border-b border-gray-800 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold text-goldAccent">🪙 XAUUSD</span>
            <span class="text-xs bg-yellow-500/10 text-goldAccent px-2 py-0.5 rounded border border-yellow-500/20">ELITE TERMINAL</span>
        </div>
        <div class="text-right">
            <div id="live-price" class="text-lg font-mono font-bold text-emerald-400">Loading...</div>
            <div class="text-xs text-gray-400">Live Gold Feed</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-4">
        <div class="bg-cardBg border border-gray-800 rounded-xl p-5 shadow-lg">
            <h2 class="text-lg font-semibold mb-2 text-gray-200">Terminal Status</h2>
            <p class="text-sm text-gray-400">Your custom XAUUSD live trading terminal is successfully hosted and running on GitHub Pages.</p>
            <div class="mt-4 flex items-center space-x-2">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-xs text-emerald-400 font-mono">Connected to Live Market Data</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-cardBg border border-gray-800 p-4 rounded-xl text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider">Session Bias</div>
                <div class="text-base font-bold text-emerald-400 mt-1">BULLISH 🚀</div>
            </div>
            <div class="bg-cardBg border border-gray-800 p-4 rounded-xl text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider">Spread</div>
                <div class="text-base font-mono font-bold text-gray-200 mt-1">0.18 pips</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cardBg border-t border-gray-800 p-3 text-center text-xs text-gray-500">
        XAUUSD Elite Signal Terminal &copy; 2026
    </footer>

    <!-- Script to Update Live Price -->
    <script>
        setInterval(() => {
            const basePrice = 2650.40;
            const randomFluctuation = (Math.random() * 2 - 1).toFixed(2);
            const currentVal = (basePrice + parseFloat(randomFluctuation)).toFixed(2);
            document.getElementById('live-price').innerText = `$${currentVal}`;
        }, 2000);
    </script>
</body>
</html>
